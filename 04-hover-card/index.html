<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04 Hover Card</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <a href="#" class="card">
        <div class="frame">
          <img class="frame-image" src="images/image1.jpg" alt="" />
          <span class="cta-button">
            <span class="button-title">View project</span>
            <span class="button-arrow">→</span>
          </span>
        </div>
        <div class="card-text">
          <span class="card-title">Lumen</span>
          <span class="card-year">2026</span>
        </div>
      </a>
    </main>
  </body>
</html>
