<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fill Button</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Geist:ital,wght@0,100..900;1,100..900&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <div class="container">
        <a href="#" class="button-cta">
          <span class="button-cta-circle" aria-hidden="true"> </span>
          <span class="button-cta-text">Start a project</span>
          <span class="button-cta-icon" aria-hidden="true">
            <span class="button-cta-arrow">
              <svg
                width="32"
                height="32"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M4 12h15" />
                <path d="M13 5.5L19.5 12L13 18.5" />
              </svg>
            </span>
          </span>
        </a>
      </div>
    </main>
  </body>
</html>
